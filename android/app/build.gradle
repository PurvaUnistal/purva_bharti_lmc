plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def keystoreProperties = new Properties()


android {
    namespace "com"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
    }

    flavorDimensions "app"
    productFlavors {
        prodPBGPL {
            dimension "app"
            applicationIdSuffix ".app.pbg.lmc"
            resValue "string", "app_name", "PBGPL LMC"
            manifestPlaceholders = [
                    appIcon: "@mipmap/pbg_logo",
                    appIconRound: "@mipmap/pbg_logo"
            ]
            def keystorePropertiesFile = rootProject.file('pbgpl-key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.0-PBGPL LMC"
        }
        prodMGL {
            dimension "app"
            applicationIdSuffix ".unistal.mgl.lmc"
            resValue "string", "app_name", "MGL LMC"
            manifestPlaceholders = [
                    appIcon: "@mipmap/mgl_logo",
                    appIconRound: "@mipmap/mgl_logo"
            ]
            def keystorePropertiesFile = rootProject.file('mgl_key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.0-MGL LMC"
        }
        prodVPPL {
            dimension "app"
            applicationIdSuffix ".unistal.vppl.lmc"
            resValue "string", "app_name", "VPPL LMC"
            manifestPlaceholders = [
                    appIcon: "@mipmap/vppl_plcms",
                    appIconRound: "@mipmap/vppl_plcms"
            ]
            versionCode 1
            versionName "1.0.0-VPPL LMC"
        }
        prodVRPL {
            dimension "app"
            applicationIdSuffix ".unistal.vrpl.lmc"
            resValue "string", "app_name", "VRPL LMC"
            manifestPlaceholders = [
                    appIcon: "@mipmap/vrpl_plcms",
                    appIconRound: "@mipmap/vrpl_plcms"
            ]
            versionCode 1
            versionName "1.0.0-VRPL LMC"
        }
        prodHPOIL {
            dimension "app"
            applicationIdSuffix ".unistal.hpoil.lmc"
            resValue "string", "app_name", "HPOIL LMC"
            manifestPlaceholders = [
                    appIcon: "@mipmap/hp_oil_logo",
                    appIconRound: "@mipmap/hp_oil_logo"
            ]
            versionCode 3
            versionName "1.0.0-HPOIL"
            def keystorePropertiesFile = rootProject.file('hpoil.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
        }
        prodAGCL {
            dimension "app"
            applicationIdSuffix ".unistal.agcl.lmc"
            resValue "string", "app_name", "AGCL LMC"
            manifestPlaceholders = [
                    appIcon: "@mipmap/agcl_logo",
                    appIconRound: "@mipmap/agcl_logo"
            ]
            versionCode 2
            versionName "1.0.0-AGCL"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }


    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/proguard/coroutines.pro'
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
}
